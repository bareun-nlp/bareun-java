syntax = "proto3";

package bareun;

option go_package = "bareun.ai/lang/bareun/genproto/bareun;svc";
option java_package = "ai.bareun.protos";
option java_multiple_files = true;
option java_outer_classname = "DictSearchServiceProto";

// DictSearchService 는 우리말샘 사전을 **자소(음소) 조건**으로 뒤지는 검색 서비스다 (#1899).
//
// 왜 따로 두나:
//   완성형 한글("신")로는 "초성이 ㅅ 이고 종성이 ㄴ 인 음절" 같은 조건을 표현할 수 없다. 그래서
//   표제어를 NFD(정준 분해)로 풀어 자모 단위 정규식을 걸어야 하는데, 사람이 키보드로 치는
//   'ㅅ'(U+3145, 호환용 자모)과 NFD 안의 초성 'ᄉ'(U+1109)·종성 'ᆺ'(U+11BA)은 **서로 다른 문자**라
//   손으로 정규식을 쓰면 오류가 아니라 조용히 0건이 나온다. 이 서비스는 사람이 읽고 쓸 수 있는
//   슬롯 패턴을 받아 그 변환을 서버가 전담한다.
//
// 구현 규약:
//   - 색인을 만들지 않는다. 요청마다 우리말샘 FlatBuffers(urimal-dict.fb) 전체를 훑는다. 서버는
//     사전 DB(PostgreSQL)를 쓰지 않고, LIKE 검색으로는 자소 조건을 애초에 걸 수 없기 때문이다.
//   - 우리말샘 사전은 맞춤법 교정(rev) 빌드에만 실린다. 따라서 이 서비스도 rev 빌드에서만 등록된다.
//     기본(형태소 분석 전용) 빌드에 요청하면 unimplemented 로 떨어진다.
service DictSearchService {
  // SearchDict 는 자소 패턴으로 우리말샘 표제어를 찾는다.
  rpc SearchDict(SearchDictRequest) returns (SearchDictResponse) {}
}

// 패턴이 표제어의 어느 위치에 걸리는지.
enum DictSearchAnchor {
  // 표제어 전체가 패턴과 맞아야 한다(기본).
  DICT_SEARCH_ANCHOR_WORD = 0;
  // 표제어의 앞부분이 맞으면 된다. 예: "송"으로 시작하는 말.
  DICT_SEARCH_ANCHOR_PREFIX = 1;
  // 표제어의 끝부분이 맞으면 된다. 예: "-아지"로 끝나는 말(송아지·망아지).
  DICT_SEARCH_ANCHOR_SUFFIX = 2;
  // 표제어 어디든 들어 있으면 된다.
  DICT_SEARCH_ANCHOR_CONTAINS = 3;
}

// 검색 요청.
message SearchDictRequest {
  // 자소 슬롯 패턴(필수). 문법은 아래와 같다.
  //
  //   토큰                뜻
  //   ------------------  ----------------------------------------------------
  //   "다" 같은 음절       그 음절 그대로(NFD 로 분해해 매칭)
  //   {초/중/종}           한 음절의 자소 조건. 필드는 '/' 로 구분한다
  //   {초중종}             '/' 없이 원자 3개를 나란히 써도 된다 — {[ㄱㄴㄷ].[ㄴㄹㅁ]}
  //   *                   음절 0개 이상
  //   ?                   음절 정확히 1개
  //
  // 슬롯의 각 필드(초성/중성/종성)에 쓸 수 있는 표기:
  //
  //   표기        뜻
  //   ----------  --------------------------------------------------------
  //   비움 또는 . 아무거나
  //   ㅅ          그 자소
  //   ㄹㄱ        합성 자모의 두 자모 이어쓰기 — 겹받침(ㄹㄱ→ㄺ)·이중모음(ㅗㅏ→ㅘ)·
  //               된소리(ㄱㄱ→ㄲ). ㄺ 같은 합성 자모는 키보드로 직접 칠 수 없어
  //               이 표기를 정식으로 받는다(한 글자 ㄺ 도 그대로 된다)
  //   ㄱ|ㅋ       여럿 중 하나
  //   [ㄱㄴㄷ]     여럿 중 하나(정규식 문자 클래스 표기). [^ㄱㄴ] 로 부정도 된다
  //   -           (종성 전용) 받침 없음
  //   +           (종성 전용) 받침이 있기만 하면 됨
  //
  // 예:
  //   "{ㅅ//ㄴ}다"            → 신다
  //   "{/ㅚ/-}다"             → 괴다 꾀다 되다 외다 죄다 …
  //   "*{//ㅎ}다"             → 낳다 넣다 놓다 내놓다 …
  //   "{[ㄱㄴㄷ].[ㄴㄹㅁ]}"    → 초성 ㄱ·ㄴ·ㄷ, 종성 ㄴ·ㄹ·ㅁ 인 1음절 표제어
  //   "아지" + anchor=SUFFIX  → 송아지 망아지 …
  string pattern = 1;

  // 패턴이 표제어의 어느 위치에 걸리는지. 기본은 표제어 전체(WORD).
  DictSearchAnchor anchor = 2;

  // 품사 필터(비우면 전체). 우리말샘 품사 표기("동사"·"명사"·"보조 동사" …)를 그대로 쓰거나,
  // 아래 별칭을 쓸 수 있다: "용언"·"동사류"·"형용사류"·"체언"·"부사류"·"수식언"·"관계언".
  // 여러 개를 주면 그중 하나라도 맞으면 통과(OR)다.
  repeated string pos = 3;

  // true 면 비표준어·방언·북한어 항목을 제외한다. 기본 false(전부 포함).
  bool std_only = 4;

  // 돌려줄 표제어 최대 개수. 0 이면 기본값 100, 상한은 1000 이다.
  // (총 몇 건이 걸렸는지는 limit 과 무관하게 total_matched 로 알려준다.)
  int32 limit = 5;

  // 건너뛸 표제어 개수(페이지 넘기기용). 기본 0.
  int32 offset = 6;

  // true 면 표제어마다 뜻풀이·용례까지 실어 준다. 기본 false — 목록만 훑을 때
  // 응답이 수십 배 커지는 것을 막기 위해 기본은 표제어·품사·활용형만 담는다.
  bool with_definition = 7;

  // true 면 항목을 담지 않고 개수만 센다(넓은 패턴의 규모를 먼저 확인할 때).
  bool count_only = 8;
}

// 표제어 하나에 딸린 뜻풀이 하나.
message DictSearchSense {
  // 우리말샘 어깨번호(senseinfo.sense_no). 0 = 미부여.
  uint32 sense_no = 1;
  // 뜻풀이.
  string definition = 2;
  // 전문 분야 등 분류.
  string category = 3;
  // 우리말샘 항목 고유 번호(target_code).
  int32 target_code = 4;
  // 용례.
  repeated string examples = 5;
}

// 검색 결과 표제어 하나. 우리말샘은 뜻풀이마다 항목이 갈리므로, 같은 (표제어, 품사)
// 는 하나로 묶고 뜻풀이를 senses 에 모아 준다.
message DictSearchEntry {
  // 표제어(완성형, NFC). 예: "송아지".
  string word = 1;
  // 우리말샘 원문 표제어. 접사·복합어 표시('-', '^')가 남아 있을 수 있다.
  string origin = 2;
  // 표제어의 자소 분해형(NFD). 어떤 자소 조건에 걸렸는지 눈으로 확인할 때 쓴다.
  string nfd = 3;
  // 품사(우리말샘 표기). 예: "명사", "동사".
  string pos = 4;
  // 이 (표제어, 품사) 에 묶인 뜻풀이 개수.
  int32 sense_count = 5;
  // 뜻풀이 목록. with_definition=false 면 비어 있다.
  repeated DictSearchSense senses = 6;
  // 활용형 정보.
  string conju = 7;
  // 발음.
  string pronunciation = 8;
  // 비표준 표기 여부.
  bool is_non_std = 9;
  // 방언 여부.
  bool is_dialect = 10;
  // 북한어 여부.
  bool is_north_korean = 11;
  // 비표준어·방언일 때의 표준 대체어(있을 때만).
  string std_word = 12;
}

// 검색 결과.
message SearchDictResponse {
  // 걸린 표제어 목록(offset/limit 적용 후). count_only=true 면 비어 있다.
  repeated DictSearchEntry entries = 1;

  // 필터까지 모두 적용해 걸린 **표제어(품사별로 묶은 것)** 총 개수. limit 과 무관하다.
  int32 total_matched = 2;

  // 걸린 사전 항목(뜻풀이 행) 총 개수. 표제어 하나가 여러 뜻풀이를 가지므로 total_matched 보다 크다.
  int32 total_senses = 3;

  // 서버가 실제로 사용한 NFD 정규식. 자소는 눈으로 구별되지 않으므로, 패턴이 어떻게
  // 해석됐는지 확인·디버깅할 때 쓴다.
  string regex = 4;

  // total_matched 가 limit+offset 보다 커서 잘렸는지 여부.
  bool truncated = 5;

  // 검색에 걸린 시간(밀리초). 색인 없이 전수 검색하므로 규모 감을 잡는 데 쓴다.
  int64 elapsed_ms = 6;

  // 훑은 사전 항목 수(사전 전체 크기).
  int32 scanned = 7;
}
