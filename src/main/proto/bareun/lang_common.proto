syntax = "proto3";

package bareun;

option go_package = "bareun.ai/lang/bareun/genproto/bareun;svc";
option java_package = "ai.bareun.protos";
option java_multiple_files = true;
option java_outer_classname = "LangCommonProto";

// 텍스트 조각
message TextSpan {
  // 텍스트 조각의 내용
  string content = 1;

  // 텍스트 조각의 위치
  // EncodingType에 따라서 위치의 값이 달라진다.
  int32 begin_offset = 2;

  // 길이
  int32 length = 3;
}

// 요청 글이 서버 기준보다 길어 앞부분만 처리했음을 알리는 정보 (#2265(9,000자 넘는 요청은 앞 5,000자만 처리)).
//
// 잘리지 않은 응답에는 이 메시지를 싣는 필드 자체가 없다. 응답 필드는 모두 proto3 optional 이라
// 이 정보를 모르는 옛 클라이언트도 그대로 동작한다(앞부분의 결과만 받을 뿐이다).
//
// 글자 수는 유니코드 코드 포인트(한글 완성형 한 글자·영문 한 자·공백·줄바꿈이 각각 한 글자)로 센다.
// 기준 값(기본 9,000자 초과 시 앞 5,000자만 처리)은 운영자가 설정으로 바꾼다. 응답의 모든 begin_offset 은
// 지금처럼 요청 글의 처음 기준이고, 앞부분을 그대로 자르므로 어긋나지 않는다.
message Truncation {
  // 요청 글 전체의 글자 수.
  int32 original_chars = 1;

  // 처리한 글자 수(앞부분). 응답의 origin·revised 와 sentences 가 이 범위다.
  int32 processed_chars = 2;

  // 처리하지 않고 버린 글자 수. original_chars - processed_chars 와 같다.
  int32 dropped_chars = 3;

  // 버린 구간이 시작하는 위치. 요청 encoding_type 기준이다(TextSpan.begin_offset 과 같은 잣대).
  // 클라이언트는 원문의 이 위치부터 끝까지가 처리되지 않은 부분임을 알 수 있다.
  // AnalyzeSyntaxList 는 글이 여러 문장이라, 이 값이 dropped_begin_sentence_index 번째 문장 안의 위치다.
  int32 dropped_begin_offset = 4;

  // 사람이 읽는 안내 문구(한국어, 괄호 안에 영어).
  string message = 5;

  // 문장 끝이나 공백을 찾지 못해 글자 중간에서 잘랐으면 참이다. 마지막 어절의 분석·교정을 믿기 어렵다.
  bool cut_mid_word = 6;
}

//
// Represents the input to API methods.
message Document {

  // 입력 전체의 내용
  // 여러 문장이 입력되면 "\n"을 넣어준다.
  string content = 2;

  // 문서의 언어. 현재는 ko_KR 만 지원한다.
  string language = 4;
}

// Represents the text encoding that the caller uses to process the output.
// Providing an `EncodingType` is recommended because the API provides the
// beginning offsets for various outputs, such as tokens and mentions, and
// languages that natively use different text encodings may access offsets
// differently.
enum EncodingType {
  // If `EncodingType` is not specified, encoding-dependent information (such as
  // `begin_offset`) will be set at `-1`.
  NONE = 0;

  // Encoding-dependent information (such as `begin_offset`) is calculated based
  // on the UTF-8 encoding of the input. C++ and Go are examples of languages
  // that use this encoding natively.
  UTF8 = 1;

  // Encoding-dependent information (such as `begin_offset`) is calculated based
  // on the UTF-16 encoding of the input. Java and JavaScript are examples of
  // languages that use this encoding natively.
  UTF16 = 2;

  // Encoding-dependent information (such as `begin_offset`) is calculated based
  // on the UTF-32 encoding of the input. Python is an example of a language
  // that uses this encoding natively.
  UTF32 = 3;
}

